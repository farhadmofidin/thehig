<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>افق ۳۶۰ | نمای بالا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --bg3:#334155;
  --blue:#3b82f6; --teal:#06b6d4; --green:#10b981;
  --gold:#f59e0b; --red:#f43f5e; --purple:#a78bfa;
  --white:#f8fafc; --text:#cbd5e1; --text2:#94a3b8;
  --floor:#1a2744; --wall:#1e3a5f; --shelf:#1e3a5f;
  --shelf-h:#2a4a7a; --aisle:#141f35;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--white);font-family:'Vazirmatn',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/* HEADER */
#header{height:52px;background:rgba(30,41,59,.95);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;backdrop-filter:blur(12px);}
.h-brand{display:flex;align-items:center;gap:10px;}
.h-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--teal));display:flex;align-items:center;justify-content:center;}
.h-logo svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;}
.h-title{font-size:13px;font-weight:700;}
.h-sub{font-size:10px;color:var(--text2);}
.h-controls{display:flex;align-items:center;gap:8px;}
.hbtn{height:30px;padding:0 14px;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px;}
.hbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);}
.hbtn.primary{background:linear-gradient(135deg,var(--blue),var(--teal));border-color:transparent;color:#fff;}
.hbtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;}
#speed-lbl{font-size:11px;color:var(--text2);}

/* STAGE */
#stage{flex:1;position:relative;overflow:hidden;}
#scene{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center center;transition:transform .6s ease;}

/* STEP PANEL */
#step-panel{position:fixed;right:18px;top:70px;width:210px;display:flex;flex-direction:column;gap:6px;z-index:50;}
.step-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.05);background:rgba(30,41,59,.7);backdrop-filter:blur(8px);transition:all .4s ease;cursor:pointer;}
.step-item.active{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.35);}
.step-item.done{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2);}
.step-num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text2);flex-shrink:0;transition:all .4s;}
.step-item.active .step-num{background:var(--blue);color:#fff;}
.step-item.done .step-num{background:var(--green);color:#fff;}
.step-lbl{font-size:11px;color:var(--text2);line-height:1.4;}
.step-item.active .step-lbl{color:var(--white);}
.step-item.done .step-lbl{color:var(--green);}

/* CAPTION */
#caption{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:50;background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 20px;font-size:13px;text-align:center;min-width:260px;backdrop-filter:blur(12px);transition:opacity .4s;color:var(--white);}
#caption .ca-t{font-weight:700;margin-bottom:3px;}
#caption .ca-d{font-size:11px;color:var(--text2);}

/* PROGRESS */
#prog-wrap{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);width:300px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;z-index:50;}
#prog-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s ease;width:0%;}

/* CONTROLS */
#controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:50;}
.cbtn{width:36px;height:36px;border-radius:50%;background:rgba(30,41,59,.9);border:1px solid rgba(255,255,255,.1);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.cbtn:hover{border-color:var(--teal);color:var(--teal);}
.cbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
#step-counter{font-size:11px;color:var(--text2);min-width:60px;text-align:center;}

/* ===== SCENE ELEMENTS ===== */
.store{position:relative;}

/* FLOOR */
.floor{position:absolute;border-radius:6px;}

/* WALLS */
.wall{position:absolute;background:var(--wall);border-radius:3px;}

/* SHELVES */
.shelf{position:absolute;background:var(--shelf);border-radius:4px;transition:background .4s;}
.shelf.highlight{background:var(--shelf-h);box-shadow:0 0 14px rgba(6,182,212,.35);}
.shelf-label{position:absolute;font-size:8px;color:rgba(255,255,255,.3);font-weight:600;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}

/* PRODUCTS on shelf */
.product{position:absolute;border-radius:2px;transition:all .3s;}
.product.scan-glow{box-shadow:0 0 6px var(--teal),0 0 12px rgba(6,182,212,.4);}

/* AISLE */
.aisle{position:absolute;background:var(--aisle);border-radius:2px;}

/* AGENT (salesperson) */
#agent{position:absolute;width:22px;height:22px;transition:left 1s ease, top 1s ease;z-index:20;}
.agent-body{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(59,130,246,.3),0 2px 8px rgba(0,0,0,.4);}
.agent-body svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2;}
.agent-pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--blue);animation:agentPulse 1.5s ease infinite;opacity:0;}

/* PHONE overlay on agent */
#phone-overlay{position:absolute;width:16px;height:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:3px;z-index:21;opacity:0;transition:opacity .3s;top:-20px;left:3px;}
.ph-screen{position:absolute;inset:2px;background:rgba(6,182,212,.15);border-radius:2px;overflow:hidden;}
.ph-scan{position:absolute;width:100%;height:2px;background:var(--teal);top:0;animation:phoneScan 1s linear infinite;}

/* SCAN BEAM */
#scan-beam{position:absolute;z-index:15;opacity:0;transition:opacity .3s;pointer-events:none;}

/* AI NODE */
#ai-node{position:absolute;width:52px;height:52px;z-index:20;opacity:0;transition:opacity .5s;}
.ai-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(167,139,250,.4);animation:aiSpin 4s linear infinite;}
.ai-ring2{position:absolute;inset:5px;border-radius:50%;border:1.5px dashed rgba(6,182,212,.3);animation:aiSpin 6s linear infinite reverse;}
.ai-center{position:absolute;inset:12px;border-radius:50%;background:rgba(167,139,250,.15);border:1.5px solid rgba(167,139,250,.5);display:flex;align-items:center;justify-content:center;}
.ai-center svg{width:12px;height:12px;stroke:var(--purple);fill:none;stroke-width:2;}
.ai-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--purple);white-space:nowrap;font-weight:700;}

/* INVOICE NODE */
#invoice-node{position:absolute;width:72px;z-index:20;opacity:0;transition:opacity .5s;}
.inv-card{background:rgba(30,41,59,.95);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.inv-head{font-size:8px;font-weight:800;color:var(--gold);margin-bottom:5px;display:flex;align-items:center;gap:4px;}
.inv-head svg{width:8px;height:8px;stroke:currentColor;fill:none;stroke-width:2;}
.inv-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.inv-p{font-size:7px;color:var(--text2);}
.inv-q{font-size:7px;font-weight:700;}
.inv-q.up{color:var(--green);}
.inv-q.same{color:var(--text);}
.inv-total{margin-top:5px;padding-top:4px;border-top:1px solid rgba(255,255,255,.07);font-size:8px;font-weight:800;color:var(--gold);display:flex;justify-content:space-between;}

/* ERP NODE */
#erp-node{position:absolute;width:64px;z-index:20;opacity:0;transition:opacity .5s;}
.erp-card{background:rgba(30,41,59,.95);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.erp-head{font-size:8px;font-weight:800;color:var(--green);margin-bottom:5px;display:flex;align-items:center;gap:3px;}
.erp-head svg{width:8px;height:8px;stroke:currentColor;fill:none;stroke-width:2;}
.erp-status{display:flex;align-items:center;gap:4px;font-size:7px;color:var(--text2);}
.erp-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:erpBlink 1s ease infinite;}
.erp-log{margin-top:4px;font-size:7px;color:var(--text2);}
.erp-log div{display:flex;align-items:center;gap:3px;margin-bottom:1px;}
.erp-log svg{width:7px;height:7px;stroke:var(--green);fill:none;stroke-width:2.5;}

/* DATA PACKETS */
.packet{position:absolute;width:6px;height:6px;border-radius:50%;z-index:25;opacity:0;}

/* TOOLTIP */
.tooltip{position:absolute;background:rgba(15,23,42,.95);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;font-size:9px;color:var(--white);white-space:nowrap;z-index:30;pointer-events:none;opacity:0;transition:opacity .3s;}

/* GPS PIN */
#gps-pin{position:absolute;z-index:22;opacity:0;transition:opacity .4s;}
.gps-circle{width:28px;height:28px;border-radius:50%;background:rgba(245,158,11,.1);border:2px solid rgba(245,158,11,.4);display:flex;align-items:center;justify-content:center;position:relative;}
.gps-circle svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:2;}
.gps-ring{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(245,158,11,.25);animation:gpsRing 2s ease-out infinite;}
.gps-ring2{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(245,158,11,.12);animation:gpsRing 2s ease-out .5s infinite;}
.gps-label{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;color:var(--gold);white-space:nowrap;}

/* BRAND TABS */
#brand-tabs{position:absolute;z-index:22;opacity:0;transition:opacity .4s;}
.brand-tab{background:rgba(30,41,59,.95);border-radius:7px;padding:6px 9px;margin-bottom:5px;border:1px solid rgba(255,255,255,.08);transition:all .3s;}
.brand-tab.active-brand{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.12);}
.bt-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.bt-name{font-size:8px;font-weight:700;color:var(--white);}
.bt-qty{font-size:8px;font-weight:800;color:var(--teal);}
.bt-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:4px;overflow:hidden;}
.bt-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width 1s ease;}

/* DATA LINES */
.dline{position:absolute;z-index:10;opacity:0;transition:opacity .5s;pointer-events:none;}

/* KEYFRAMES */
@keyframes agentPulse{0%,100%{opacity:0;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes phoneScan{0%{top:0}100%{top:calc(100% - 2px)}}
@keyframes aiSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes erpBlink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes gpsRing{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
@keyframes packetMove{0%{opacity:1}100%{opacity:0}}
@keyframes beamPulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes scanLine{0%{transform:translateY(0)}100%{transform:translateY(var(--sh,60px))}}
</style>
</head>
<body>

<div id="header">
  <div class="h-brand">
    <div class="h-logo"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></div>
    <div><div class="h-title">افق ۳۶۰</div><div class="h-sub">نمای بالا — گردش کار هوشمند</div></div>
  </div>
  <div class="h-controls">
    <span id="speed-lbl">سرعت:</span>
    <button class="hbtn" onclick="setSpeed(.5)">۰.۵×</button>
    <button class="hbtn" onclick="setSpeed(1)" id="spd1" style="border-color:rgba(6,182,212,.5);color:var(--teal)">۱×</button>
    <button class="hbtn" onclick="setSpeed(2)">۲×</button>
    <button class="hbtn" onclick="toggleAuto()">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span id="auto-lbl">خودکار</span>
    </button>
  </div>
</div>

<div id="stage">
  <div id="scene">
    <!-- will be built by JS -->
  </div>
</div>

<!-- Step panel -->
<div id="step-panel"></div>

<!-- Caption -->
<div id="caption">
  <div class="ca-t" id="cap-t">آماده</div>
  <div class="ca-d" id="cap-d">برای شروع دکمه پخش را بزنید</div>
</div>

<!-- Progress -->
<div id="prog-wrap"><div id="prog-bar"></div></div>

<!-- Controls -->
<div id="controls">
  <button class="cbtn" id="btn-prev" onclick="stepBy(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <button class="cbtn" id="btn-play" onclick="togglePlay()" style="width:44px;height:44px;background:linear-gradient(135deg,var(--blue),var(--teal));border-color:transparent;">
    <svg id="play-icon" viewBox="0 0 24 24" style="stroke:#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <svg id="pause-icon" viewBox="0 0 24 24" style="stroke:#fff;display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
  </button>
  <button class="cbtn" id="btn-next" onclick="stepBy(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
  <span id="step-counter">۱ / ۶</span>
</div>

<script>
const W=820, H=540;
let speed=1, autoPlay=false, autoTimer=null, currentStep=-1, playing=false, stepTimer=null;

const STEPS = [
  { t:'ورود به فروشگاه', d:'فروشنده وارد می‌شود · فروشگاه با GPS انتخاب می‌شود', color:'var(--gold)' },
  { t:'عکس‌برداری از شلف', d:'دوربین باز می‌شود · شلف‌ها اسکن می‌شوند', color:'var(--teal)' },
  { t:'پردازش هوش مصنوعی', d:'محصولات شناسایی · وضعیت شلف تحلیل می‌شود', color:'var(--purple)' },
  { t:'تولید پیش‌فاکتور', d:'الگوریتم رشد · محصولات تأکیدی · جایزه', color:'var(--gold)' },
  { t:'ویرایش برند‌به‌برند', d:'فروشنده اقلام را تنظیم می‌کند', color:'var(--blue)' },
  { t:'ثبت در راهکاران', d:'ربات هوشمند فاکتور را ثبت می‌کند', color:'var(--green)' },
];

const perNum = n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

/* ─── BUILD SCENE ─── */
const scene = document.getElementById('scene');
scene.style.width=W+'px'; scene.style.height=H+'px'; scene.style.position='relative';

// Floor
const floor = el('div','floor',{left:0,top:0,width:W,height:H,background:'#141f35',position:'absolute',borderRadius:'8px'});
// Grid lines
for(let x=40;x<W;x+=40){ const g=el('div',null,{position:'absolute',left:x,top:0,width:1,height:H,background:'rgba(255,255,255,.025)'}); scene.appendChild(g); }
for(let y=40;y<H;y+=40){ const g=el('div',null,{position:'absolute',left:0,top:y,width:W,height:1,background:'rgba(255,255,255,.025)'}); scene.appendChild(g); }
scene.appendChild(floor);

// Outer walls
addWall(0,0,W,8);    // top
addWall(0,H-8,W,8);  // bottom
addWall(0,0,8,H);    // left
addWall(W-8,0,8,H);  // right

// Entrance indicator
const entrance = el('div',null,{position:'absolute',left:W/2-24,bottom:0,width:48,height:8,background:'rgba(245,158,11,.4)',zIndex:5,borderRadius:'0 0 0 0'});
const entranceLbl = el('div',null,{position:'absolute',left:W/2-20,bottom:12,fontSize:'8px',color:'rgba(245,158,11,.6)',fontWeight:'700',zIndex:5});
entranceLbl.textContent='ورودی';
scene.appendChild(entrance); scene.appendChild(entranceLbl);

// SHELF layout  (x,y,w,h,label,brandColor)
const shelves=[
  {x:30, y:30,  w:140,h:22, label:'برند مام',   c:'#3b82f6', products:8},
  {x:30, y:65,  w:140,h:22, label:'برند سان',   c:'#06b6d4', products:7},
  {x:30, y:100, w:140,h:22, label:'رقیب A',     c:'#64748b', products:5},

  {x:220,y:30,  w:140,h:22, label:'برند مام',   c:'#3b82f6', products:9},
  {x:220,y:65,  w:140,h:22, label:'برند نوا',   c:'#a78bfa', products:6},
  {x:220,y:100, w:140,h:22, label:'رقیب B',     c:'#64748b', products:4},

  {x:410,y:30,  w:140,h:22, label:'برند سان',   c:'#06b6d4', products:8},
  {x:410,y:65,  w:140,h:22, label:'برند نوا',   c:'#a78bfa', products:7},
  {x:410,y:100, w:140,h:22, label:'رقیب C',     c:'#64748b', products:3},

  {x:600,y:30,  w:140,h:22, label:'برند مام',   c:'#3b82f6', products:10},
  {x:600,y:65,  w:140,h:22, label:'ویژه',       c:'#f59e0b', products:5},
  {x:600,y:100, w:140,h:22, label:'رقیب D',     c:'#64748b', products:6},

  // Middle shelves
  {x:30, y:200, w:140,h:22, label:'برند مام',   c:'#3b82f6', products:7},
  {x:30, y:235, w:140,h:22, label:'برند سان',   c:'#06b6d4', products:8},
  {x:220,y:200, w:140,h:22, label:'برند نوا',   c:'#a78bfa', products:6},
  {x:220,y:235, w:140,h:22, label:'برند مام',   c:'#3b82f6', products:9},
  {x:410,y:200, w:140,h:22, label:'ویژه',       c:'#f59e0b', products:5},
  {x:410,y:235, w:140,h:22, label:'رقیب E',     c:'#64748b', products:4},
  {x:600,y:200, w:140,h:22, label:'برند سان',   c:'#06b6d4', products:7},
  {x:600,y:235, w:140,h:22, label:'برند نوا',   c:'#a78bfa', products:8},
];

shelves.forEach((s,i)=>{
  const sh=el('div','shelf shelf-'+i,{left:s.x,top:s.y,width:s.w,height:s.h});
  // shelf background stripe
  sh.style.background=`linear-gradient(90deg,${s.c}18,${s.c}0a)`;
  sh.style.borderLeft=`2px solid ${s.c}55`;
  // products
  for(let p=0;p<s.products;p++){
    const prod=el('div','product p-'+i+'-'+p,{
      position:'absolute',
      top:3, left:4+p*(s.w/(s.products+1)),
      width:s.w/(s.products+1)-2,
      height:s.h-6,
      background:s.c+'33',
      border:`1px solid ${s.c}44`,
      borderRadius:2
    });
    sh.appendChild(prod);
  }
  const lbl=el('div','shelf-label',{}); lbl.textContent=s.label;
  lbl.style.cssText=`position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:7px;color:${s.c}88;font-weight:700;`;
  sh.appendChild(lbl);
  scene.appendChild(sh);
});

// Aisles
addAisle(180,15,8,280,'vertical');
addAisle(370,15,8,280,'vertical');
addAisle(560,15,8,280,'vertical');
addAisle(15,140,W-30,8,'horizontal');
addAisle(15,270,W-30,8,'horizontal');
addAisle(15,340,W-30,8,'horizontal');
addAisle(15,420,W-30,8,'horizontal');

// Checkout counters at bottom
for(let i=0;i<3;i++){
  const cc=el('div',null,{position:'absolute',left:120+i*180,bottom:30,width:100,height:35,background:'rgba(30,41,59,.8)',border:'1px solid rgba(255,255,255,.08)',borderRadius:5,zIndex:5});
  const cl=el('div',null,{position:'absolute',top:0,left:0,right:0,bottom:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',color:'rgba(255,255,255,.3)',fontWeight:'600'});
  cl.textContent='صندوق '+(i+1); cc.appendChild(cl); scene.appendChild(cc);
}

// GPS PIN

/* ─── STEP PANEL ─── */
const panel=document.getElementById('step-panel');
STEPS.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='step-item'; d.id='si-'+i;
  d.onclick=()=>goTo(i);
  d.innerHTML=`<div class="step-num">${perNum(i+1)}</div><div class="step-lbl">${s.t}</div>`;
  panel.appendChild(d);
});

/* ─── STEP LOGIC ─── */
function goTo(n){
  if(n===currentStep)return;
  if(n<0||n>=STEPS.length)return;
  const prev=currentStep;
  currentStep=n;
  updateStepPanel();
  updateCaption();
  updateProgress();
  updateCounter();
  runStepAnim(n, prev);
}

function runStepAnim(n, prev){
  // Hide all overlays first, then show relevant ones
  switch(n){
    case 0: step_enter(); break;
    case 1: step_scan(); break;
    case 2: step_ai(); break;
    case 3: step_invoice(); break;
    case 4: step_brands(); break;
    case 5: step_erp(); break;
  }
}

/* ─── STEP ANIMATIONS ─── */
function step_enter(){
  // Agent walks in from bottom
  hideAll();
  fadeIn(gpsPin);
  agentPos(W/2-11, H-70);
  setTimeout(()=>agentPos(W/2-11, H-130), 600/speed);
  setTimeout(()=>agentPos(W/2-11, H-200), 1200/speed);
  // GPS pulse visible
  setTimeout(()=>fadeOut(gpsPin), 2500/speed);
}

function step_scan(){
  // Show phone, move agent along shelves, cast scan beam
  hideGpsPin();
  agentPos(60, 20);
  show(phoneOverlay, 1);
  // Highlight shelves one by one
  const shEls=document.querySelectorAll('.shelf');
  shEls.forEach(s=>s.classList.remove('highlight'));
  setTimeout(()=>{
    shEls[0].classList.add('highlight');
    drawScanBeam(60,20, 30,30,140,22);
  }, 400/speed);
  setTimeout(()=>{
    shEls[0].classList.remove('highlight');
    shEls[1].classList.add('highlight');
    agentPos(60, 55);
    drawScanBeam(60,55, 30,65,140,22);
  }, 900/speed);
  setTimeout(()=>{
    shEls[1].classList.remove('highlight');
    shEls[2].classList.add('highlight');
    agentPos(60, 90);
    drawScanBeam(60,90, 30,100,140,22);
  }, 1400/speed);
  setTimeout(()=>{
    shEls[2].classList.remove('highlight');
    // Move to next aisle
    agentPos(250, 20);
    shEls[3].classList.add('highlight');
    drawScanBeam(250,20, 220,30,140,22);
  }, 2000/speed);
  setTimeout(()=>{
    shEls.forEach(s=>s.classList.remove('highlight'));
    clearScanBeam();
  }, 2800/speed);
}

function step_ai(){
  clearScanBeam();
  document.querySelectorAll('.shelf').forEach(s=>s.classList.remove('highlight'));
  hide(phoneOverlay);
  agentPos(W/2-11, H/2-11);
  // Show AI node floating
  const ai=document.getElementById('ai-node');
  ai.style.left=(W/2-26)+'px';
  ai.style.top=(H/2-86)+'px';
  fadeIn(ai);
  // Animate products glowing
  const prods=document.querySelectorAll('.product');
  let i=0;
  const t=setInterval(()=>{
    if(i<prods.length){ prods[i].classList.add('scan-glow'); i++; }
    else { clearInterval(t); setTimeout(()=>prods.forEach(p=>p.classList.remove('scan-glow')),600/speed); }
  }, 18/speed);
  // Data packets from products to AI
  spawnPackets(ai, 8);
}

function step_invoice(){
  const ai=document.getElementById('ai-node');
  const inv=document.getElementById('invoice-node');
  // Keep AI small
  ai.style.left=(W/2-26)+'px'; ai.style.top=(H/2-86)+'px';
  fadeIn(inv);
  agentPos(100, H/2-10);
  // Animate line from AI to invoice
  spawnPackets(inv, 5);
}

function step_brands(){
  const inv=document.getElementById('invoice-node');
  const bt=document.getElementById('brand-tabs');
  fadeIn(bt);
  fadeOut(inv);
  agentPos(W-200, H/2-10);
  // Cycle active brand
  const tabs=bt.querySelectorAll('.brand-tab');
  let active=0;
  const cycle=setInterval(()=>{
    tabs.forEach(t=>t.classList.remove('active-brand'));
    tabs[active%tabs.length].classList.add('active-brand');
    active++;
    if(active>tabs.length*1.5) clearInterval(cycle);
  }, 600/speed);
}

function step_erp(){
  const bt=document.getElementById('brand-tabs');
  const erp=document.getElementById('erp-node');
  const ai=document.getElementById('ai-node');
  fadeOut(bt); fadeOut(ai);
  agentPos(W/2-11, 150);
  fadeIn(erp);
  // Animate more log entries
  setTimeout(()=>{
    const log=document.getElementById('erp-log');
    const r=document.createElement('div');
    r.innerHTML=`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>نوا — ثبت شد`;
    log.appendChild(r);
  }, 800/speed);
  setTimeout(()=>{
    const log=document.getElementById('erp-log');
    const r=document.createElement('div');
    r.innerHTML=`<svg viewBox="0 0 24 24" style="stroke:var(--gold)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span style="color:var(--gold)">جایزه ۶۲M — فعال شد</span>`;
    log.appendChild(r);
  }, 1400/speed);
  spawnPackets(erp, 6);
}

/* ─── HELPERS ─── */
function el(tag,cls,styles){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  Object.assign(e.style,{position:'absolute'});
  Object.assign(e.style,styles||{});
  scene.appendChild(e);
  return e;
}
function addWall(x,y,w,h){ const e=el('div','wall',{left:x,top:y,width:w,height:h}); }
function addAisle(x,y,w,h){ const e=el('div','aisle',{left:x,top:y,width:w,height:h}); }

function agentPos(x,y){ const a=document.getElementById('agent'); a.style.left=x+'px'; a.style.top=y+'px'; }
function show(el,op=1){ el.style.opacity=op; }
function hide(el){ el.style.opacity=0; }
function fadeIn(el){ el.style.opacity=0; el.style.display=''; requestAnimationFrame(()=>{ el.style.transition='opacity .5s'; el.style.opacity=1; }); }
function fadeOut(el){ el.style.opacity=0; }
function hideAll(){
  fadeOut(document.getElementById('ai-node'));
  fadeOut(document.getElementById('invoice-node'));
  fadeOut(document.getElementById('brand-tabs'));
  fadeOut(document.getElementById('erp-node'));
  hide(phoneOverlay);
  clearScanBeam();
  document.querySelectorAll('.shelf').forEach(s=>s.classList.remove('highlight'));
}
function hideGpsPin(){ fadeOut(document.getElementById('gps-pin')); }

function drawScanBeam(ax,ay, sx,sy,sw,sh){
  clearScanBeam();
  const c=document.createElementNS('http://www.w3.org/2000/svg','svg');
  c.setAttribute('width',W); c.setAttribute('height',H);
  c.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:15;';
  // Beam lines
  const makeL=(x1,y1,x2,y2,clr)=>{
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1+11);l.setAttribute('y1',y1+11);
    l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke',clr);l.setAttribute('stroke-width','1.5');l.setAttribute('opacity','.5');
    l.setAttribute('stroke-dasharray','4 3');
    c.appendChild(l);
  };
  makeL(ax,ay,sx,sy,'rgba(6,182,212,.6)');
  makeL(ax,ay,sx+sw,sy,'rgba(6,182,212,.6)');
  // Scan overlay on shelf
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',sx);r.setAttribute('y',sy);r.setAttribute('width',sw);r.setAttribute('height',sh);
  r.setAttribute('fill','rgba(6,182,212,.08)');r.setAttribute('stroke','rgba(6,182,212,.5)');r.setAttribute('stroke-width','1');r.setAttribute('rx','3');
  c.appendChild(r);
  // scan line moving
  const sl=document.createElementNS('http://www.w3.org/2000/svg','line');
  sl.setAttribute('x1',sx);sl.setAttribute('x2',sx+sw);
  sl.setAttribute('y1',sy);sl.setAttribute('y2',sy);
  sl.setAttribute('stroke','var(--teal)');sl.setAttribute('stroke-width','1.5');sl.setAttribute('opacity','.9');
  c.appendChild(sl);
  let scanY=sy; const scanDir=1; const scanAnim=()=>{
    scanY+=0.4*speed;
    if(scanY>sy+sh)scanY=sy;
    sl.setAttribute('y1',scanY);sl.setAttribute('y2',scanY);
    requestAnimationFrame(scanAnim);
  };
  requestAnimationFrame(scanAnim);
  scanBeam.parentNode&&scene.appendChild(c);
  scene._scanSvg=c; c.style.opacity=1;
}
function clearScanBeam(){ if(scene._scanSvg){ scene._scanSvg.remove(); scene._scanSvg=null; } }

function spawnPackets(targetEl, count){
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const p=document.createElement('div');
      p.style.cssText=`position:absolute;width:5px;height:5px;border-radius:50%;background:var(--teal);z-index:30;pointer-events:none;`;
      const r=targetEl.getBoundingClientRect();
      const sr=scene.getBoundingClientRect();
      const tx=r.left-sr.left+r.width/2;
      const ty=r.top-sr.top+r.height/2;
      const startX=Math.random()*W, startY=Math.random()*H;
      p.style.left=startX+'px'; p.style.top=startY+'px';
      p.style.transition=`left ${(0.6+Math.random()*.4)/speed}s ease, top ${(0.6+Math.random()*.4)/speed}s ease, opacity .2s`;
      scene.appendChild(p);
      requestAnimationFrame(()=>{
        setTimeout(()=>{
          p.style.left=tx+'px'; p.style.top=ty+'px';
          setTimeout(()=>{ p.style.opacity=0; setTimeout(()=>p.remove(),200); },(500/speed));
        },20);
      });
    }, i*120/speed);
  }
}

function updateStepPanel(){
  STEPS.forEach((_,i)=>{
    const el=document.getElementById('si-'+i);
    el.classList.remove('active','done');
    if(i===currentStep) el.classList.add('active');
    else if(i<currentStep) el.classList.add('done');
  });
}
function updateCaption(){
  const s=STEPS[currentStep];
  document.getElementById('cap-t').textContent=s.t;
  document.getElementById('cap-d').textContent=s.d;
  document.getElementById('cap-t').style.color=s.color;
}
function updateProgress(){
  document.getElementById('prog-bar').style.width=((currentStep+1)/STEPS.length*100)+'%';
}
function updateCounter(){
  document.getElementById('step-counter').textContent=`${perNum(currentStep+1)} / ${perNum(STEPS.length)}`;
}

/* ─── PLAYBACK ─── */
function togglePlay(){
  playing=!playing;
  document.getElementById('play-icon').style.display=playing?'none':'block';
  document.getElementById('pause-icon').style.display=playing?'block':'none';
  if(playing) scheduleNext();
  else { clearTimeout(stepTimer); }
}
function scheduleNext(){
  if(!playing)return;
  const dur=[2800,3200,2500,2500,3000,3500];
  const delay=dur[currentStep]||2800;
  stepTimer=setTimeout(()=>{
    if(currentStep<STEPS.length-1){ stepBy(1); scheduleNext(); }
    else { playing=false; document.getElementById('play-icon').style.display='block'; document.getElementById('pause-icon').style.display='none'; }
  }, delay/speed);
}
function stepBy(d){
  clearTimeout(stepTimer);
  const n=currentStep+d;
  if(n>=0&&n<STEPS.length) goTo(n);
  if(playing&&d>0) scheduleNext();
}
function setSpeed(s){
  speed=s;
  document.querySelectorAll('.hbtn:not(.primary)').forEach(b=>{b.style.borderColor='';b.style.color='';});
  event.target.style.borderColor='rgba(6,182,212,.5)'; event.target.style.color='var(--teal)';
  if(playing){ clearTimeout(stepTimer); scheduleNext(); }
}
function toggleAuto(){
  autoPlay=!autoPlay;
  document.getElementById('auto-lbl').textContent=autoPlay?'توقف':'خودکار';
  if(autoPlay&&!playing) togglePlay();
  else if(!autoPlay&&playing) togglePlay();
}

// Kick off
goTo(0);
</script>
